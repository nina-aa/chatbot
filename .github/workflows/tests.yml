name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The unit tests use fakes only. The keys are blank on purpose: if a test ever tried
      # to call OpenAI or Gemini it would fail here instead of silently spending tokens.
      - name: Run tests
        run: python -m pytest -q
        env:
          OPENAI_API_KEY: ""
          GOOGLE_API_KEY: ""
