name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The unit tests use fakes only. The keys are blank on purpose: if a test ever tried
      # to call OpenAI or Gemini it would fail here instead of silently spending tokens.
      - name: Run tests
        run: python -m pytest -q
        env:
          OPENAI_API_KEY: ""
          GOOGLE_API_KEY: ""

  # The same store contract tests, run against a real Postgres with pgvector. The default
  # job above skips them, so a failure here does not hide the fast unit-test result.
  pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docrag
          POSTGRES_PASSWORD: docrag
          POSTGRES_DB: docrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docrag -d docrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the Postgres store tests
        run: python -m pytest -q -m integration -rs
        env:
          DATABASE_URL: postgresql://docrag:docrag@localhost:5432/docrag
          OPENAI_API_KEY: ""
          GOOGLE_API_KEY: ""
